name: Deploy AR poster to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare current website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html poster.jpg targets.mind video.mp4 _site/
          echo 'c25fb31c83c46f11d55d05e928160d71bb878ea9c776c8d2988cc57d54fc62d1  _site/video.mp4' | sha256sum --check
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
