name: Deploy AR poster to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website and restore original video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html poster.jpg targets.mind _site/
          cat video.mp4.part-01 video.mp4.part-02 > _site/video.mp4
          echo '85991cfd70f13df7bdea0f956a1a9ba6e92f6be375d88153a357f248bc2251fe  _site/video.mp4' | sha256sum --check
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
