<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="ar-version" content="3-stable-tracking">
  <title>AR 海报体验</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #tips {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      z-index: 10000;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(17, 24, 39, 0.88);
      color: white;
      text-align: center;
      line-height: 1.6;
    }
    #status { margin: 0; font-size: 15px; }
    #playButton {
      margin-top: 10px;
      padding: 10px 20px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: #111827;
      font: inherit;
      cursor: pointer;
    }
    [hidden] { display: none !important; }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.querySelector("a-scene");
      const target = document.querySelector("#target");
      const video = document.querySelector("#arVideo");
      const status = document.querySelector("#status");
      const playButton = document.querySelector("#playButton");
      let targetVisible = false;

      const setStatus = (message) => { status.textContent = message; };

      // 在允许自动播放的浏览器中静音播放；被拦截时提供点击播放入口。
      async function playVideo() {
        if (!targetVisible || document.hidden) return;
        try {
          await video.play();
          // 等待播放期间，用户可能已经把摄像头移开。
          if (!targetVisible || document.hidden) {
            video.pause();
            return;
          }
          playButton.hidden = true;
          setStatus("已识别海报 · 视频播放中");
        } catch (error) {
          if (!targetVisible || document.hidden) return;
          if (error.name === "NotAllowedError") {
            playButton.hidden = false;
            setStatus("已识别海报，请点击播放");
          } else {
            setStatus("视频暂时无法播放，请检查 video.mp4 后刷新页面。");
          }
        }
      }

      target.addEventListener("targetFound", () => {
        targetVisible = true;
        playVideo();
      });

      target.addEventListener("targetLost", () => {
        targetVisible = false;
        video.pause();
        if (video.readyState > 0) video.currentTime = 0;
        playButton.hidden = true;
        setStatus("请将摄像头对准海报");
      });

      scene.addEventListener("arReady", () => {
        setStatus("请将摄像头对准海报");
      });

      scene.addEventListener("arError", () => {
        video.pause();
        setStatus("AR 启动失败，请检查摄像头权限，并使用手机浏览器打开 HTTPS 网页。");
      });

      video.addEventListener("error", () => {
        setStatus("视频加载失败，请确认同一文件夹中有可播放的 video.mp4。");
      });

      playButton.addEventListener("click", playVideo);

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) video.pause();
        else if (targetVisible) playVideo();
      });

      if (location.protocol === "file:" || !window.isSecureContext) {
        setStatus("请部署到 HTTPS 网站后，用手机浏览器打开；直接双击此文件无法测试 AR。");
      } else if (!window.AFRAME || !window.MINDAR) {
        setStatus("AR 组件加载失败，请检查网络后刷新页面。");
      }
    });
  </script>
</head>

<body>
  <div id="tips">
    <p id="status" role="status" aria-live="polite">正在启动 AR，请允许使用摄像头……</p>
    <button id="playButton" type="button" hidden>播放视频</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 10;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <video
        id="arVideo"
        src="./video.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- 当前海报为 2160 × 3840（9:16）。height = 海报高度 / 海报宽度。 -->
      <!-- AE 视频应与海报保持相同宽高比。 -->
      <a-video
        src="#arVideo"
        position="0 0 0.01"
        width="1"
        height="1.777778"
      ></a-video>
    </a-entity>
  </a-scene>
</body>
</html>
